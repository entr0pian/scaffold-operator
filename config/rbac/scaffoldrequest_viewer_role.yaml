# This rule is not used by the project scaffold-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to scaffold.taskapp.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: scaffold-operator
    app.kubernetes.io/managed-by: kustomize
  name: scaffoldrequest-viewer-role
rules:
- apiGroups:
  - scaffold.taskapp.io
  resources:
  - scaffoldrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scaffold.taskapp.io
  resources:
  - scaffoldrequests/status
  verbs:
  - get
