# This rule is not used by the project scaffold-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over scaffold.taskapp.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: scaffold-operator
    app.kubernetes.io/managed-by: kustomize
  name: scaffoldrequest-admin-role
rules:
- apiGroups:
  - scaffold.taskapp.io
  resources:
  - scaffoldrequests
  verbs:
  - '*'
- apiGroups:
  - scaffold.taskapp.io
  resources:
  - scaffoldrequests/status
  verbs:
  - get
