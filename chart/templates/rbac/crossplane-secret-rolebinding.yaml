# Grants this operator's own ServiceAccount (deployed in .Release.Namespace)
# read access to the crossplane-github-credentials Secret that actually
# lives in the crossplane-system namespace — the one cross-namespace RBAC
# pattern this operator needs (see scaffoldrequest_controller.go's
# githubClientFor and this chart's README). Namespace is hardcoded to
# crossplane-system rather than templated: this Role/RoleBinding pair must
# be applied in that namespace regardless of which namespace the operator
# itself is installed into.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: crossplane-system
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "scaffold-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "scaffold-operator.resourceName" (dict "suffix" "crossplane-secret-reader" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scaffold-operator.resourceName" (dict "suffix" "crossplane-secret-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "scaffold-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
